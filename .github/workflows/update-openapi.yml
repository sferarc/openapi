name: Update OpenAPI

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"

jobs:
  openapi-gen:
    name: Update ${{ matrix.package }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.package }}
      cancel-in-progress: true
    continue-on-error: true

    strategy:
      matrix:
        package:
          - vercel-api-js
          - netlify-api
          - zoom-api-js
          - keycloak-api
          - cloudflare-api-js
          - nuki-api-js
          - litellm-api
          - v0-api

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup and install
        uses: ./.github/actions/setup

      - name: Build OpenAPI spec from PR
        run: pnpm generate --filter=${{ matrix.package }}

      - name: Format code
        run: pnpm check:fix

      - name: Analyze changes and create changeset
        run: pnpm tsx ./.github/workflows/scripts/changes.ts ${{ matrix.package }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - run: git add .

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          commit-message: "Update OpenAPI Spec"
          committer: "SferaDev <SferaDev@users.noreply.github.com>"
          title: "[OpenAPI] Spec updates for ${{ matrix.package }}"
          body: |
            This is an autogenerated PR to update the OpenAPI spec with the latest merged changes.

            Auto-merge is enabled: it squash-merges itself once the `Check` job is green.
            Disable auto-merge on the PR if it needs a human look first.
          branch: openapi/${{ matrix.package }}

      # Spec updates are mechanical regenerations gated by the same `Check` job as any
      # other PR, so they merge themselves rather than queueing up for a manual click.
      #
      # The PAT is what makes this useful: a merge performed by `github.token` produces a
      # push to main that triggers no workflows, so the Release job would never see the
      # changeset this PR carries. Enabling auto-merge as the PAT's user attributes the
      # merge to a real account and lets Release run.
      #
      # Idempotent — a rerun that only updates an existing PR re-enables what is already on.
      # Skipped on `closed`, which is what the action reports when the regenerated spec
      # matched main again and it closed the stale PR out from under us.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
