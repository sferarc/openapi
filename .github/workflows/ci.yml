name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public repository, so CI runs on GitHub-hosted runners: public repos get free
# minutes and the self-hosted pool is kept for private repos.

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup and install
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm tsc

      - name: Check linting
        run: pnpm check

      # CI never commits, so the hooks never run here. This at least fails on a
      # lefthook.yml that lefthook would not load.
      - name: Hook config
        run: pnpm exec lefthook validate

      - name: Run tests
        run: pnpm test
