name: Update Dependencies

on:
  schedule:
    - cron: "0 7 * * 1" # Every Monday at 7am UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    # mise (tool downloads) and pinact (Action tag lookups) query the GitHub REST
    # API. A job-level token authenticates those calls so they don't share the
    # anonymous 60 req/hour limit. create-pull-request is unaffected — it uses its
    # explicit `token:` input.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always base the update against the default branch so create-pull-request
          # has a valid `origin/main` to reset onto, even on a manual dispatch from
          # another branch.
          ref: main

      - name: Setup and install
        uses: ./.github/actions/setup
        with:
          # This job rewrites the lockfile, so it can't use a frozen install — it runs
          # its own `pnpm install` steps below. Only the toolchain is needed here.
          install-deps: "false"

      - name: Install new versions
        run: |
          # Bump the mise toolchain to latest first, so the rest of the run — and the
          # generated lockfile — executes under the versions we pin.
          #
          # pnpm is excluded from `--bump` and updated within its current major instead.
          # A pnpm major is a migration, not a bump: v11 alone moved `overrides` out of
          # package.json, renamed `onlyBuiltDependencies` to `allowBuilds`, and started
          # failing installs on ignored build scripts. Crossing the next one deserves the
          # same deliberate treatment rather than landing unattended at 07:00 on a Monday.
          bumpable=$(yq -p toml -oy -r '.tools | keys | .[] | select(. != "pnpm")' mise.toml | tr '\n' ' ')
          mise up --bump $bumpable
          mise up pnpm
          mise install

          # pnpm fails any command that resolves a dependency shipping build scripts when
          # `allowBuilds` has no decision for it, recording a `set this to true or false`
          # placeholder. An update pulling in such a package therefore fails the whole job
          # (this is how @scarf/scarf broke it). Wrap the commands that resolve dependencies:
          # default new entries to false — never execute an install script we have not opted
          # into — and retry. The additions show up in the PR diff, so a reviewer can flip one
          # to true if a build really is required.
          #
          # `pnpm update` installs as part of its work, so it needs this as much as `pnpm
          # install` does.
          with_allow_builds() {
            "$@" && return 0
            echo "::warning::new dependencies ship build scripts; defaulting them to allowBuilds: false"
            yq -i '.allowBuilds |= with_entries(.value = (.value == true))' pnpm-workspace.yaml
            "$@"
          }

          # Mirror the pnpm version into `packageManager`, which turbo and Vercel read.
          jq --arg v "pnpm@$(mise current pnpm)" '.packageManager = $v' package.json > package.tmp && mv package.tmp package.json

          # Clear the generated security overrides before updating; `pnpm audit --fix`
          # regenerates them below. Keep the hand-written ones — `@kubb/renderer-jsx` holds
          # a peer conflict together and audit will never re-add it, so a blanket
          # `del(.overrides)` would drop it permanently.
          yq -i '.overrides |= with_entries(select(.key == "@kubb/renderer-jsx"))' pnpm-workspace.yaml
          with_allow_builds pnpm install --no-frozen-lockfile

          # Update dependencies.
          # `catalogMode: strict` (pnpm-workspace.yaml) makes `pnpm update --latest` abort
          # with ERR_PNPM_CATALOG_VERSION_MISMATCH: our published API-client packages declare
          # broad peer ranges (e.g. `effect: ^3.0.0`) that intentionally differ from the exact
          # catalog pin, and strict mode refuses to reconcile them while resolving "latest".
          # Relax to `manual` for the bump — catalog entries still update and the peer ranges
          # are left untouched — then restore `strict`.
          sed -i 's/^catalogMode: strict/catalogMode: manual/' pnpm-workspace.yaml
          with_allow_builds pnpm update --recursive --latest
          sed -i 's/^catalogMode: manual/catalogMode: strict/' pnpm-workspace.yaml

          # Patch vulnerabilities (regenerates the overrides in pnpm-workspace.yaml). If a
          # generated override can't be resolved (e.g. a patched version not yet published to
          # npm), drop the generated ones so the update PR still opens; they regenerate once
          # the fix lands. The hand-written pins are kept, as above.
          #
          # `--fix` takes a value on pnpm 11 ("override" or "update"); the bare flag is a usage
          # error. Because this is followed by `|| true`, getting that wrong fails silently and
          # the PR ships with the overrides cleared and never regenerated — every security
          # override dropped, with nothing red to show for it. Report it instead of swallowing.
          pnpm audit --fix override || echo "::warning::pnpm audit --fix failed; security overrides may be missing from this PR"
          with_allow_builds pnpm install --no-frozen-lockfile || {
            echo "::warning::install failed after audit --fix; clearing generated overrides and retrying"
            yq -i '.overrides |= with_entries(select(.key == "@kubb/renderer-jsx"))' pnpm-workspace.yaml
            with_allow_builds pnpm install --no-frozen-lockfile
          }

          # Update biome config, then fix formatting and linting issues
          pnpm biome migrate --write
          pnpm check:fix

          # Pin and update GitHub Actions to commit SHAs
          pinact run --update .github/workflows/*.yml .github/actions/*/action.yml

          # Commit changes
          git add .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          commit-message: "Update dependencies"
          committer: "SferaDev Bot <sferadev@users.noreply.github.com>"
          title: "Update dependencies"
          body: |
            This is an autogenerated PR to update the dependencies!
          branch: update-dependencies-${{ github.run_id }}
