name: Update Dependencies

on:
  schedule:
    - cron: "0 7 * * 1" # Every Monday at 7am UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    # mise (tool downloads) and pinact (Action tag lookups) query the GitHub REST
    # API. A job-level token authenticates those calls so they don't share the
    # anonymous 60 req/hour limit. create-pull-request is unaffected — it uses its
    # explicit `token:` input.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always base the update against the default branch so create-pull-request
          # has a valid `origin/main` to reset onto, even on a manual dispatch from
          # another branch.
          ref: main

      - name: Setup and install
        uses: ./.github/actions/setup
        with:
          # This job rewrites the lockfile, so it can't use a frozen install — it runs
          # its own `pnpm install` steps below. Only the toolchain is needed here.
          install-deps: "false"

      - name: Install new versions
        id: update
        run: |
          # Bump the mise toolchain to latest first, so the rest of the run — and the
          # generated lockfile — executes under the versions we pin.
          #
          # pnpm is excluded from `--bump` and updated within its current major instead.
          # A pnpm major is a migration, not a bump: v11 alone moved `overrides` out of
          # package.json, renamed `onlyBuiltDependencies` to `allowBuilds`, and started
          # failing installs on ignored build scripts. Crossing the next one deserves the
          # same deliberate treatment rather than landing unattended at 07:00 on a Monday.
          bumpable=$(yq -p toml -oy -r '.tools | keys | .[] | select(. != "pnpm")' mise.toml | tr '\n' ' ')
          mise up --bump $bumpable
          mise up pnpm
          mise install

          # pnpm fails any command that resolves a dependency shipping build scripts when
          # `allowBuilds` has no decision for it, recording a `set this to true or false`
          # placeholder. An update pulling in such a package therefore fails the whole job
          # (this is how @scarf/scarf broke it). Wrap the commands that resolve dependencies:
          # default new entries to false — never execute an install script we have not opted
          # into — and retry. The additions show up in the PR diff, so a reviewer can flip one
          # to true if a build really is required.
          #
          # `pnpm update` installs as part of its work, so it needs this as much as `pnpm
          # install` does.
          with_allow_builds() {
            "$@" && return 0
            echo "::warning::new dependencies ship build scripts; defaulting them to allowBuilds: false"
            yq -i '.allowBuilds |= with_entries(.value = (.value == true))' pnpm-workspace.yaml
            "$@"
          }

          # Mirror the pnpm version into `packageManager`, which turbo and Vercel read.
          jq --arg v "pnpm@$(mise current pnpm)" '.packageManager = $v' package.json > package.tmp && mv package.tmp package.json

          # The committed overrides install cleanly on main, so they are both the floor this PR
          # must not ship below and the fallback if a regenerated set turns out unresolvable.
          overrides_snapshot="$RUNNER_TEMP/committed-overrides.yaml"
          git show HEAD:pnpm-workspace.yaml | yq '.overrides // {}' > "$overrides_snapshot"

          # Clear them so `audit --fix` regenerates against the freshly resolved tree rather than
          # layering onto stale ranges. Safe to clear wholesale: nothing hand-written lives here
          # any more, and the snapshot above is what makes it recoverable.
          yq -i '.overrides = {}' pnpm-workspace.yaml
          with_allow_builds pnpm install --no-frozen-lockfile

          # Update dependencies.
          # `catalogMode: strict` (pnpm-workspace.yaml) makes `pnpm update --latest` abort
          # with ERR_PNPM_CATALOG_VERSION_MISMATCH: our published API-client packages declare
          # broad peer ranges (e.g. `effect: ^3.0.0`) that intentionally differ from the exact
          # catalog pin, and strict mode refuses to reconcile them while resolving "latest".
          # Relax to `manual` for the bump — catalog entries still update and the peer ranges
          # are left untouched — then restore `strict`.
          sed -i 's/^catalogMode: strict/catalogMode: manual/' pnpm-workspace.yaml
          with_allow_builds pnpm update --recursive --latest
          sed -i 's/^catalogMode: manual/catalogMode: strict/' pnpm-workspace.yaml

          # Patch vulnerabilities (regenerates the overrides in pnpm-workspace.yaml).
          #
          # `--fix` takes a value on pnpm 11 ("override" or "update"); the bare flag is a usage
          # error. Warn rather than `|| true`: swallowing it once shipped a PR with every security
          # override dropped and nothing red to show for it.
          pnpm audit --fix override || echo "::warning::pnpm audit --fix failed; security overrides may be missing from this PR"

          # `audit --fix` is not publish-aware — it will emit an override pointing at a version that
          # was never released, and one such entry fails the install for all of them. The phantom
          # `esbuild@^0.24.3` has broken this job three times (#594, #601, #626).
          overrides_dropped=""
          yq -r '.overrides // {} | keys | .[]' pnpm-workspace.yaml > "$RUNNER_TEMP/override-keys.txt"
          while IFS= read -r key; do
            if [ -z "$key" ]; then continue; fi
            target=$(key="$key" yq -r '.overrides[strenv(key)]' pnpm-workspace.yaml)
            # Keys read `<name>@<range>`, so splitting on the last "@" keeps scoped names intact.
            pkg="${key%@*}"
            if ! npm view "$pkg@$target" version >/dev/null 2>&1; then
              key="$key" yq -i 'del(.overrides[strenv(key)])' pnpm-workspace.yaml
              overrides_dropped="$overrides_dropped $pkg@$target"
            fi
          done < "$RUNNER_TEMP/override-keys.txt"
          if [ -n "$overrides_dropped" ]; then
            echo "::warning::dropped unresolvable generated overrides:$overrides_dropped"
          fi

          # Union the committed set underneath the generated one so a run can only add protection.
          # A redundant override is a no-op; a missing one is a silent security regression.
          snapshot="$overrides_snapshot" yq -i '.overrides = load(strenv(snapshot)) * (.overrides // {})' pnpm-workspace.yaml

          # `pnpm audit --fix` emits `overrides` as one flow-style line, which makes a 50-entry
          # map unreviewable in a diff — a single changed entry rewrites the whole line. Re-emit
          # it as a block map so each override reads as its own line, like every other key here.
          yq -i '.overrides style="" | .overrides[] style=""' pnpm-workspace.yaml

          # Restore rather than clear, so the worst case is "no new advisories this week" instead
          # of "every security override silently deleted".
          overrides_fallback=""
          with_allow_builds pnpm install --no-frozen-lockfile || {
            echo "::warning::install failed after audit --fix; restoring the committed overrides and retrying"
            overrides_fallback="1"
            snapshot="$overrides_snapshot" yq -i '.overrides = load(strenv(snapshot)) | .overrides style="" | .overrides[] style=""' pnpm-workspace.yaml
            with_allow_builds pnpm install --no-frozen-lockfile
          }

          # The merge makes this unreachable unless a step above is broken. A missed week is
          # recoverable; a PR that quietly drops security overrides is what this job keeps shipping.
          committed_count=$(yq 'keys | length' "$overrides_snapshot")
          current_count=$(yq '.overrides // {} | keys | length' pnpm-workspace.yaml)
          if [ "$current_count" -lt "$committed_count" ]; then
            echo "::error::security overrides shrank from $committed_count to $current_count"
            exit 1
          fi

          # Update biome config, then fix formatting and linting issues
          pnpm biome migrate --write
          pnpm check:fix

          # Pin and update GitHub Actions to commit SHAs
          pinact run --update .github/workflows/*.yml .github/actions/*/action.yml

          # Surface workarounds in the PR body — a `::warning::` only reaches the run log, which is
          # where every bad outcome this job has shipped went unnoticed.
          notes=""
          if [ -n "$overrides_dropped" ]; then
            notes="$notes"$'\n'"- Dropped generated overrides that resolve to no published version:$overrides_dropped"
          fi
          if [ -n "$overrides_fallback" ]; then
            notes="$notes"$'\n'"- \`pnpm audit --fix\` produced an unresolvable set, so the security overrides were **restored from \`main\` unchanged** — no new advisories were picked up this week."
          fi
          {
            echo "notes<<UPDATE_NOTES_EOF"
            echo "$notes"
            echo "UPDATE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          # Commit changes
          git add .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GIT_TOKEN }}
          commit-message: "Update dependencies"
          committer: "SferaDev Bot <sferadev@users.noreply.github.com>"
          title: "Update dependencies"
          body: |
            This is an autogenerated PR to update the dependencies!
            ${{ steps.update.outputs.notes }}
          branch: update-dependencies-${{ github.run_id }}
