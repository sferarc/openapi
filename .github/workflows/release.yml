name: Release

# Changesets flow: pending changesets on main open a version PR, and merging
# that PR publishes. Nothing runs until the repository variable RELEASE_ENABLED
# is `true`, so the first release from this repository is the owner's decision.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    # A dispatch from another branch must not publish unreviewed code.
    if: github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing exchanges this OIDC token for a publish credential,
      # so no npm token is stored anywhere. Each package's trusted publisher on
      # npmjs.com must name sferarc/openapi and release.yml.
      id-token: write
    steps:
      # An App token rather than github.token: a version PR merged by the Actions bot
      # pushes to main without triggering this workflow, so it would never publish.
      - name: Mint the sferarc-hq App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HQ_APP_ID }}
          private-key: ${{ secrets.HQ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node comes from mise.toml, and its bundled npm (11.5.1 or newer) is what
      # performs the trusted-publishing exchange. Nothing writes an ~/.npmrc: an
      # empty _authToken there would be sent instead of the OIDC exchange.
      - name: Setup and install
        uses: ./.github/actions/setup

      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          github-token: ${{ steps.app.outputs.token }}

      # The version PR only carries what `changeset version` generated, so the
      # required Check job is the whole review. Merging it publishes.
      - name: Enable auto-merge on the version PR
        if: steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge --squash --auto "${{ steps.changesets.outputs.pr-number }}"

      # The official MCP registry lists keycloak-api-mcp from packages/keycloak-api/server.json.
      # It refuses an npm version without a matching mcpName, and a listed version is final,
      # so every run lists the keycloak-api version on main once npm serves it with mcpName.
      - name: Check the keycloak-api-mcp registry listing
        id: mcp
        run: |
          set -euo pipefail
          dir=packages/keycloak-api
          name="$(jq -r .name "$dir/server.json")"
          version="$(jq -r .version "$dir/package.json")"
          # Retries cover npm serving a version a few seconds after this run published it.
          npm_name="$(curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors "https://registry.npmjs.org/keycloak-api/${version}" | jq -r '.mcpName // empty' || true)"
          if [ "$npm_name" != "$name" ]; then
            echo "::notice title=MCP registry::keycloak-api@${version} on npm has no mcpName ${name}, so it is not listed."
            echo "list=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/${version}")"
          if [ "$code" = "200" ]; then
            echo "list=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' "$dir/server.json" > "$RUNNER_TEMP/server.json"
          echo "list=true" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.mcp.outputs.list == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Pinned and checked against the registry's own release workflow signature.
      - name: Download and verify mcp-publisher
        if: steps.mcp.outputs.list == 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      # GitHub OIDC grants the io.github.sferarc namespace with the id-token this job already has.
      - name: List keycloak-api-mcp in the MCP registry
        if: steps.mcp.outputs.list == 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish "$RUNNER_TEMP/server.json"
