  # TypeScript 7 dropped the JavaScript compiler API that bunchee uses to emit type
  # declarations. `@typescript/typescript6` is the compatibility shim bunchee looks for
  # ("install `@typescript/typescript6` as dev dependency to keep building types"); it must
  # stay installed at the workspace root for as long as bunchee has no native TS 7 path.
  # Do not remove it when bunchee bumps — verify a package build emits .d.ts first. The two
  # versions are deliberately paired, so they sit together rather than in alphabetical order.
  typescript: 7.0.2
  '@typescript/typescript6': 6.0.2
