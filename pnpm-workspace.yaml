  core-js: false
  es5-ext: false
  esbuild: false
  keytar: false
  lefthook: true
  prisma: false
  puppeteer: false
  sharp: false
# minimumReleaseAgeExclude: intentionally empty.
# Each exclude un-gates ONE pinned version from pnpm's minimumReleaseAge window (1 day by
# default on pnpm 11; this repo does not set it explicitly). Once that version is older than
# the window the line is inert, and on 2026-08-28 every one of the 21 entries was — the
# youngest was 25 days old, and four named versions that were never published at all
# (esbuild@0.24.3, next-auth@5.0.0, lodash@4.17.24, js-yaml@4.1.2). Removing them left
# pnpm-lock.yaml byte-identical. `pnpm audit --fix` appends new entries every week; retire
# the aged-out ones each review rather than letting the list become permanent.
minimumReleaseAgeExclude: []
