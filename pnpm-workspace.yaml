  # KEEP-BACK: TypeScript 7 dropped the JavaScript compiler API that bunchee uses to
  # emit type declarations, so every package build fails with "Detected TypeScript
  # 7.0.2 ... install `@typescript/typescript6`". bunchee's peer range already claims
  # ^7.0, so the range is not a reliable signal — test a package build before releasing
  # this. Moving to TS 7 is its own PR, not a weekly bump.
  typescript: 6.0.3
  vitest: 4.1.10
  yaml: 2.9.0
  zod: 4.4.3
  # Must track the other @kubb packages above, not its own latest. kubb publishes
  # renderer-jsx ahead of adapter-oas/core, and @kubb/core peer-requires the exact
  # matching version — a newer renderer-jsx here means an unmet peer. `pnpm update
  # --latest` will bump it past this; re-pin it to match when reviewing the weekly PR.
  '@kubb/renderer-jsx': 5.0.0-beta.10
